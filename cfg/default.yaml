robot_name: "my_gen3"
arm_group_name: "arm"
leap_ns: "/leapmotion"
leap_hand: "right"
arm_base_link: "base_link"
arm_reference_frame: "base_link"
arm_workspace_min: [0.0, -1.3, 0.0] # m in reference frame
arm_workspace_max: [1.6, 1.3, 1.6] # m in reference frame
leap_workspace_min: [-0.4, -0.5, 0.05] # m in leap motion frame
leap_workspace_max: [0.4, 0.5, 0.7] # m in leap motion frame

# Kinova Gen3 teleoperation parameters
vel_scale_factor: 2.0 # %
max_linear_vel: 1.0 # m/s
max_angular_vel: 1.57 # rad/s
mismatch_threshold: 0.75 # m in arm base frame
inactivity_timeout: 5.0 # s (-1 to disable)
home_arm_joint_state: [0.0, -0.35, 3.14, -2.54, 0.0, -0.87, 1.57] # in radians
ready_arm_joint_state: [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57] # in radians

# Robotiq 2f 85 gripper (optional)
control_gripper: true
home_gripper_position: 1.0 # fully closed
ready_gripper_position: 0.0 # fully open

