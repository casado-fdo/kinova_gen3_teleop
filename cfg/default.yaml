robot_name: "my_gen3"
arm_group_name: "arm"
leap_ns: "/leapmotion"
leap_hand: "right"
arm_base_link: "base_link"
arm_reference_frame: "base_link"
arm_workspace_min: [0.0, -1.3, 0.0] # m in reference frame
arm_workspace_max: [1.6, 1.3, 1.6] # m in reference frame
leap_workspace_min: [-0.35, -0.45, 0.1] # m in leap motion frame
leap_workspace_max: [0.35, 0.45, 0.7] # m in leap motion frame

# Home and ready joint configurations
home_joint_state: [0.0, -0.35, 3.14, -2.54, 0.0, -0.87, 1.57]
ready_joint_state: [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]

# Teleoperation
vel_scale_factor: 2.0 # %
max_linear_vel: 1.0 # m/s
max_angular_vel: 1.57 # rad/s
mismatch_threshold: 0.75 # m in arm base frame
pinch_threshold: 0.35 # where 0.5 means 50% of the range
control_gripper: true
inactivity_timeout: 5.0 # s (-1 to disable)